<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보건의료 4개 기관 보도자료</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.full.min.js"></script>
<style>
/* [hidden]은 브라우저 기본 규칙이라 우선순위가 가장 낮다 — display를 주는 클래스에 밀린다 */
[hidden]{display:none !important}
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1d2228; --muted:#7b838c;
  --accent:#1a5fa8; --hi:#c0392b; --mid:#d4780a; --lo:#8a9199;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"나눔고딕코딩",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}
.wrap{max-width:1360px;margin:0 auto;padding:18px 16px 60px}
a{color:var(--accent)}
h1{font-size:19px;margin:0;font-weight:700}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:4px}
.sub{font-size:12px;color:var(--muted);font-family:var(--mono)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.notice{padding:10px 14px;border-radius:8px;font-size:13px;margin:12px 0}
.notice.warn{background:#fdf0ed;border:1px solid #f3c6bc;color:#8e2f1e}
.notice.info{background:#eef4fb;border:1px solid #cfe0f2;color:#24496f}

/* 요약 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.cards .card{padding:11px 13px;cursor:pointer;transition:border-color .12s}
.cards .card:hover{border-color:var(--accent)}
.cards .card.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cards .k{font-size:12px;color:var(--muted)}
.cards .v{font-size:21px;font-weight:700;font-family:var(--mono);line-height:1.2}

/* 필터 */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 13px;margin-bottom:12px}
.bar input[type=date],.bar input[type=search],.bar select{
  border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;background:#fff;color:inherit}
.bar input[type=search]{min-width:220px;flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 11px;
  font-size:13px;cursor:pointer;color:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.excel{background:#1a7a3c;border-color:#1a7a3c;color:#fff}
.count{font-size:12px;color:var(--muted);font-family:var(--mono);margin-left:auto}

/* 목록 */
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.row{display:grid;grid-template-columns:86px 104px 1fr auto;gap:10px;align-items:start;
  padding:11px 14px;cursor:pointer}
.row:hover{background:#fafbfc}
.date{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.title{font-weight:600}
.meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;background:#eef1f4;color:#4a545e}
.rel{font-size:11px;font-weight:700;white-space:nowrap;padding-top:3px;text-align:right}
.rel.높음{color:var(--hi)} .rel.보통{color:var(--mid)} .rel.낮음{color:var(--lo)}
.ours-n{font-size:11px;color:var(--accent);font-weight:600}
.body{padding:0 14px 16px 200px;font-size:13px}
@media(max-width:900px){.row{grid-template-columns:72px 1fr}.rel,.row>.agency{grid-column:auto}.body{padding-left:14px}}
.body .txt{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;max-height:360px;overflow:auto;color:#333}
.body h4{margin:14px 0 6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.ours li{margin:3px 0}
.ours .why{color:var(--muted);font-size:11px;font-family:var(--mono)}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>보건의료 4개 기관 보도자료</h1>
  <span class="badge" style="background:#eef4fb;color:#24496f">보건복지부 · 식약처 · 건보공단 · 심평원</span>
  <span class="sub" id="stamp"></span>
</header>
<div class="sub" id="source"></div>

<div id="warn" class="notice warn" hidden></div>
<div id="fail" class="notice warn" hidden></div>

<div class="cards" id="cards"></div>

<div class="card bar">
  <input type="date" id="from" onchange="onFilter()">
  <span style="color:var(--muted)">~</span>
  <input type="date" id="to" onchange="onFilter()">
  <select id="rel" onchange="onFilter()">
    <option value="">관련도 전체</option>
    <option value="높음">높음만</option>
    <option value="높음+보통">높음+보통</option>
    <option value="낮음">낮음만</option>
  </select>
  <select id="topic" onchange="onFilter()"><option value="">주제 전체</option></select>
  <input type="search" id="q" placeholder="제목·본문 검색 (여러 낱말은 모두 포함, -낱말은 제외)" oninput="onFilter()">
  <label style="font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer">
    <input type="checkbox" id="onlyOurs" onchange="onFilter()"> 우리 자료와 엮인 것만
  </label>
  <button class="btn" onclick="resetFilters()">초기화</button>
  <button class="btn excel" onclick="downloadExcel()">엑셀</button>
  <span class="count" id="count"></span>
</div>

<div class="card" id="list"><div class="empty">불러오는 중…</div></div>

<div class="notice info" style="margin-top:18px" id="howto"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 이 화면은 docs/press.json(정부 보도자료)과 docs/ours.json(우리 보도자료·기사)만 읽는다.
// 구글 시트를 브라우저가 직접 읽을 수는 없어(CORS) GitHub Actions가 매일 옮겨 둔다.
// 판정 규칙은 전부 아래 상수다 — 고치면 바로 화면에 반영된다(수집을 다시 돌릴 필요 없음).
// ─────────────────────────────────────────────────────────────────────────────

const AGENCY = {
  '보건복지부':      {short:'복지부', color:'#1a5fa8'},
  '식품의약품안전처': {short:'식약처', color:'#1a7a3c'},
  '국민건강보험공단': {short:'건보공단', color:'#7b3fa0'},
  '건강보험심사평가원':{short:'심평원', color:'#c0392b'},
};

// 주제 태그 — **제목과 본문 앞머리**(TAG_HEAD자)에서 찾는다.
//   core : 병원 운영·진료·연구에 직접 닿는 것 → 하나라도 있으면 관련도 '높음'
//   mid  : 닿긴 하지만 사안에 따라 갈리는 것   → 관련도 '보통'
//   far  : 우리 일과 먼 것                     → core가 없으면 관련도 '낮음'
//
// **본문 전체를 보면 안 된다.** 보도자료 뒤쪽에는 근거 법령·참고자료·다른 사업 설명이
// 붙어 지나가는 말이 다 걸린다 — `폐의약품 수거` 기사에 `노인 일자리`(복지일반)가,
// `수능 마약류 점검`에 `고혈압`(질환관리)이 그렇게 붙었다. 정부 보도자료는 앞머리에
// 무엇에 대한 글인지가 다 나오므로 거기까지만 본다.
const TAG_HEAD = 400;
//
// **낱말은 실제 보도자료에 나오는 말로 고르고, 다른 말 안에 박히지 않는지 꼭 확인한다.**
// 처음에 넣었다가 뺀 것들 — 전부 기관 이름 안에 글자가 들어 있었다:
//   · `심사평가` ← `건강보험심사평가원`. 심평원 보도자료 **전부**가 '수가·급여'로 찍혔다.
//   · `식품`     ← `식품의약품안전처`.   식약처 보도자료 **전부**가 '식품·위생'으로 찍혔다.
//   · `전문의`   ← `전문의약품`.         마약류 점검 기사가 '의료인력·수련'이 됐다.
//   · `AI`       ← 영문 낱말 속 AI.      `\bAI\b`로 묶었다.
const TOPICS = [
  {key:'수가·급여',      kind:'core', re:/수가|급여화|요양급여|상대가치|진료비|보상 ?체계|본인부담|보장성|건강보험 적용|급여 기준|비급여/},
  {key:'의료AI·데이터',  kind:'core', re:/인공지능|\bAI\b|빅데이터|의료데이터|데이터 ?표준|상호운용|디지털 ?의료|의료정보|마이데이터|전자의무기록|EMR|정밀의료/},
  {key:'의료인력·수련',  kind:'core', re:/전공의|전문의(?!약품)|수련|의료인력|간호 ?인력|간호사|의과대학|의대 ?정원|인력 ?기준|당직/},
  {key:'환자안전·감염',  kind:'core', re:/환자안전|의료사고|감염 ?관리|의료관련감염|감염병|낙상|투약 ?오류|손 ?위생/},
  {key:'응급·중증',      kind:'core', re:/응급의료|응급실|중증|권역 ?외상|심뇌혈관|이송 ?체계|필수의료/},
  {key:'질환·검진',      kind:'core', re:/암 ?관리|암 ?검진|국가 ?검진|건강검진|희귀질환|만성질환|치매|당뇨|고혈압|재활/},
  {key:'돌봄·지역의료',  kind:'core', re:/통합 ?돌봄|재택의료|방문 ?진료|호스피스|완화의료|지역 ?의료|공공 ?의료|요양병원|간병/},
  {key:'연구·R&D',       kind:'core', re:/연구개발|R&D|연구 ?과제|성과교류|기술개발|실증|연구중심병원|임상연구/},
  {key:'의약품·의료기기',kind:'mid',  re:/의약품(?!안전처)|의약외품|의료기기|신약|품목 ?허가|임상시험|마약류|혁신의료기기|첨단재생|백신|회수 ?조치/},
  {key:'행사·협약',      kind:'mid',  re:/포럼|세미나|설명회|학술대회|공모|시상|수상|캠페인|업무협약|간담회|토론회|공청회/},
  {key:'식품·위생',      kind:'far',  re:/식품(?!의약품)|식중독|농축수산|GMO|유전자변형|급식|건강기능식품|주류|축산물|이물/},
  {key:'복지일반',       kind:'far',  re:/위기가구|기초생활|사회보장|아동학대|노인 ?일자리|장애인 ?복지|복지 ?사각|보육|연금/},
  {key:'기관 내부',      kind:'far',  re:/임직원|노사|채용 ?공고|봉사활동|체험 ?교육|청렴|윤리경영|조직 ?개편|인사 ?발령/},
];

// ── 우리 자료와 엮기 ─────────────────────────────────────────────────────────
// 정부 보도자료의 낱말과 우리 보도자료·기사 제목의 낱말이 겹치는 정도로 본다.
// 글자쌍(bigram)이 아니라 **낱말**로 보는 이유는, 글자쌍으로 재면 `의료`·`사업` 같은
// 흔한 조각이 사방에서 맞아 아무 기사나 끌려오기 때문이다.
const JOSA = /(은|는|이|가|을|를|의|에|와|과|로|으로|도|만|에서|에게|부터|까지|라고|이라고|에는|으로는)$/;
// 보건의료 글이면 어디에나 나오는 말 — 이것만 겹치는 건 '관련'이 아니다
const STOP = new Set(`
보건복지부 식품의약품안전처 국민건강보험공단 건강보험심사평가원 식약처 심평원 공단 복지부
병원 의료 의료계 의료기관 환자 국민 정부 기관 사업 제도 정책 방안 계획 추진 지원 강화 확대
마련 개최 실시 운영 발표 공개 제공 시행 도입 구축 개선 관리 평가 활용 참여 협력 연계 대상
결과 내용 주요 관련 통해 위해 대한 이번 올해 지난 다음 전국 국내 지역 현장 중심 기반 체계
서비스 프로그램 시스템 데이터 정보 기술 분야 산업 기업 전문가 담당자 관계자 교수 연구 연구팀
서울아산병원 아산병원 서울 아산 밝혔다 했다 한다 된다 있다 등의 등을 및 또한 특히 이를 이에
적용 다른 모색 논의 확인 공유 안내 개선 자동 전국적 가능 필요 사용 이용 선정 발굴 조성 개발
`.trim().split(/\s+/));
// `11월`·`2026년`·`3개` 같은 **숫자+단위**는 아무 글에나 있다. 이것만 겹쳐 점수 5점을 넘겨
// `통합사례관리 전국대회`가 `동대문구 … 4개 …` 기사와 엮인 적이 있다
const NUM_UNIT = /^\d+(년|월|일|시|분|회|차|개|명|건|곳|억|만|천|％|%|kg|mm|cm|km)?$/;

const MATCH_FLOOR = 5;   // 아래 가중치 합이 이 값 이상이면 '엮인 것'으로 본다
const MATCH_MAX = 6;     // 한 건에 보여 줄 우리 자료 개수
// 긴 낱말일수록 우연히 겹칠 일이 적다 — 4글자 이상 하나(3점) + 3글자 하나(2점)면 문턱을 넘는다
function wordWeight(w) { return w.length >= 4 ? 3 : w.length === 3 ? 2 : 1; }

function words(text) {
  const out = new Set();
  for (let raw of String(text || '').split(/[^가-힣A-Za-z0-9]+/)) {
    if (!raw) continue;
    let w = raw.replace(JOSA, '');
    if (w.length < 2 || STOP.has(w)) continue;
    if (NUM_UNIT.test(w)) continue;         // 날짜·개수는 아무 글에나 있다
    out.add(w);
  }
  return out;
}

let press = [], ours = {보도자료: [], 기사: []}, ourIndex = [], rows = [];

function buildOurIndex() {
  ourIndex = [];
  (ours['보도자료'] || []).forEach(([ymd, title]) =>
    ourIndex.push({kind: '보도자료', ymd, title, link: '', w: words(title)}));
  (ours['기사'] || []).forEach(([ymd, media, title, link]) =>
    ourIndex.push({kind: '기사', ymd, title, media, link, w: words(title)}));
}

// 보도자료 한 건과 엮이는 우리 자료를 점수 순으로. 본문은 앞부분만 본다 —
// 뒤쪽은 참고자료·문의처라 겹쳐도 뜻이 없다
const BODY_HEAD = 500;
function ourMatches(p) {
  const gw = words(p['제목'] + ' ' + (p['본문'] || '').slice(0, BODY_HEAD));
  const hits = [];
  for (const o of ourIndex) {
    let score = 0;
    const shared = [];
    for (const w of o.w) if (gw.has(w)) { score += wordWeight(w); shared.push(w); }
    if (score >= MATCH_FLOOR) hits.push({...o, score, shared});
  }
  hits.sort((a, b) => b.score - a.score || b.ymd.localeCompare(a.ymd));
  // 보도자료를 기사보다 먼저 — 우리가 낸 것이 있으면 그게 가장 쓸모 있다
  hits.sort((a, b) => (a.kind === '보도자료' ? 0 : 1) - (b.kind === '보도자료' ? 0 : 1));
  return hits.slice(0, MATCH_MAX);
}

function topicsOf(p) {
  const text = p['제목'] + ' ' + (p['본문'] || '').slice(0, TAG_HEAD);
  return TOPICS.filter(t => t.re.test(text));
}
// 높음 = 우리 일에 바로 닿는 주제가 있다 · 낮음 = 먼 주제뿐이다 · 보통 = 그 사이
// **가까운 주제와 먼 주제가 같이 있으면 '보통'으로 내린다.** `복지서비스, AI로 더 똑똑해진
// 모바일 행복이`가 `AI` 하나로 '높음'이 됐는데, 복지 안내 앱이라 우리 일과는 멀다.
// 둘이 섞였다는 건 경계에 있다는 뜻이라 사람이 보고 판단할 자리다.
function relevanceOf(tags) {
  const core = tags.some(t => t.kind === 'core'), far = tags.some(t => t.kind === 'far');
  if (core) return far ? '보통' : '높음';
  return far ? '낮음' : '보통';
}

// ── 불러오기 ─────────────────────────────────────────────────────────────────
async function load() {
  const bust = '?t=' + Date.now();
  let data = null;
  try {
    data = await (await fetch('./press.json' + bust)).json();
  } catch (e) {
    document.getElementById('fail').hidden = false;
    document.getElementById('fail').textContent =
      '보도자료 데이터를 불러오지 못했습니다 (docs/press.json). 수집 워크플로가 한 번은 돌아야 합니다.';
    document.getElementById('list').innerHTML = '<div class="empty">데이터 없음</div>';
    return;
  }
  try { ours = await (await fetch('./ours.json' + bust)).json(); } catch (e) { /* 없으면 엮기만 빠진다 */ }
  buildOurIndex();

  press = (data['보도자료'] || []).map(p => {
    const tags = topicsOf(p);
    return {...p, tags, rel: relevanceOf(tags), matches: ourMatches(p)};
  });

  document.getElementById('stamp').textContent =
    `마지막 수집 ${(data['기준시각'] || '').slice(0, 16)} · 전체 ${data['건수']}건`;
  document.getElementById('source').innerHTML =
    `원본 <a href="${data['시트']}" target="_blank" rel="noopener">구글 시트</a> ` +
    `· 우리 자료 ${ourIndex.length}건 (보도자료 ${(ours['보도자료'] || []).length} · 기사 ${(ours['기사'] || []).length}, ${ours['기준일'] || '-'} 이후)`;

  // 수집로그에 실패가 있으면 숫자를 믿지 말라고 띄운다 — '오류를 신규 0건으로 읽지 않기'
  const last = (data['수집로그'] || [])[0];
  const bad = (data['수집로그'] || []).filter(l => l.결과 && l.결과 !== '성공');
  if (bad.length) {
    const w = document.getElementById('warn');
    w.hidden = false;
    w.innerHTML = `<b>수집 경고</b> — ${bad.map(b => `${b.기관}: ${b.결과}${b.비고 ? ' (' + b.비고 + ')' : ''}`).join(' · ')}`;
  }
  document.getElementById('howto').innerHTML =
    `수집은 Aside가 매일 09:00(KST)에 시트를 채우고, GitHub Actions가 그 시트를 읽어 이 화면을 갱신합니다. ` +
    `<b>화면이 안 바뀌면 수집이 아직 안 돈 것</b>이지 기사가 없는 것이 아닙니다` +
    (last ? ` (시트 마지막 실행 ${last.실행시각}).` : '.') +
    ` 관련도·주제 태그는 규칙으로 붙인 <b>추정</b>이고, 판단은 사람이 합니다.`;

  fillTopicSelect();
  buildCards();
  onFilter();
}

function fillTopicSelect() {
  const sel = document.getElementById('topic');
  const n = {};
  press.forEach(p => p.tags.forEach(t => n[t.key] = (n[t.key] || 0) + 1));
  TOPICS.filter(t => n[t.key]).forEach(t => {
    const o = document.createElement('option');
    o.value = t.key; o.textContent = `${t.key} (${n[t.key]})`;
    sel.appendChild(o);
  });
}

let agencyPick = '';
function buildCards() {
  const box = document.getElementById('cards');
  const n = {};
  press.forEach(p => n[p.기관] = (n[p.기관] || 0) + 1);
  const hi = press.filter(p => p.rel === '높음').length;
  const linked = press.filter(p => p.matches.length).length;
  box.innerHTML =
    Object.keys(AGENCY).map(a => `
      <div class="card ${agencyPick === a ? 'on' : ''}" onclick="pickAgency('${a}')" title="${a}만 보기">
        <div class="k"><span class="badge" style="background:${AGENCY[a].color}22;color:${AGENCY[a].color}">${AGENCY[a].short}</span></div>
        <div class="v">${n[a] || 0}</div>
      </div>`).join('') +
    `<div class="card" style="cursor:default"><div class="k">관련도 높음</div><div class="v" style="color:var(--hi)">${hi}</div></div>
     <div class="card" style="cursor:default"><div class="k">우리 자료와 엮임</div><div class="v" style="color:var(--accent)">${linked}</div></div>`;
}
function pickAgency(a) { agencyPick = (agencyPick === a) ? '' : a; buildCards(); onFilter(); }

function resetFilters() {
  ['from', 'to', 'q'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('rel').value = '';
  document.getElementById('topic').value = '';
  document.getElementById('onlyOurs').checked = false;
  agencyPick = '';
  buildCards(); onFilter();
}

// 검색: 공백으로 나눈 모든 낱말을 AND, `-낱말`은 제외. 대상은 제목+본문+부서
function searchHit(p, q) {
  if (!q) return true;
  const hay = (p.제목 + ' ' + p.본문 + ' ' + p.부서).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(term =>
    term.startsWith('-') ? !hay.includes(term.slice(1)) : hay.includes(term));
}

function onFilter() {
  const from = document.getElementById('from').value;
  const to = document.getElementById('to').value;
  const rel = document.getElementById('rel').value;
  const topic = document.getElementById('topic').value;
  const q = document.getElementById('q').value.trim();
  const onlyOurs = document.getElementById('onlyOurs').checked;

  rows = press.filter(p =>
    (!agencyPick || p.기관 === agencyPick) &&
    (!from || p.날짜 >= from) && (!to || p.날짜 <= to) &&
    (!rel || (rel === '높음+보통' ? p.rel !== '낮음' : p.rel === rel)) &&
    (!topic || p.tags.some(t => t.key === topic)) &&
    (!onlyOurs || p.matches.length) &&
    searchHit(p, q));

  document.getElementById('count').textContent = `${rows.length}건`;
  render();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const open = new Set();
function toggle(id) { open.has(id) ? open.delete(id) : open.add(id); render(); }

function render() {
  const box = document.getElementById('list');
  if (!rows.length) { box.innerHTML = '<div class="empty">조건에 맞는 보도자료가 없습니다.</div>'; return; }
  box.innerHTML = rows.map(p => {
    const a = AGENCY[p.기관] || {short: p.기관, color: '#666'};
    const isOpen = open.has(p.id);
    return `<div class="item">
      <div class="row" onclick="toggle('${esc(p.id)}')">
        <div class="date">${esc(p.날짜)}</div>
        <div class="agency"><span class="badge" style="background:${a.color}1a;color:${a.color}">${esc(a.short)}</span></div>
        <div>
          <div class="title">${esc(p.제목)}</div>
          <div class="meta">
            ${p.부서 ? `<span>${esc(p.부서)}</span>` : ''}
            ${p.tags.map(t => `<span class="tag">${esc(t.key)}</span>`).join('')}
            ${p.matches.length ? `<span class="ours-n">우리 자료 ${p.matches.length}건</span>` : ''}
            ${p.상태 && p.상태 !== '전체' ? `<span class="tag" style="background:#fdf0ed;color:#8e2f1e">본문 ${esc(p.상태)}</span>` : ''}
          </div>
        </div>
        <div class="rel ${p.rel}">${p.rel}<div style="font-weight:400;color:var(--muted);font-size:10px">${isOpen ? '접기' : '펼치기'}</div></div>
      </div>
      ${isOpen ? bodyHtml(p) : ''}
    </div>`;
  }).join('');
}

function bodyHtml(p) {
  const ours = p.matches.length ? `
    <h4>우리 쪽 관련 자료 ${p.matches.length}건</h4>
    <ul class="ours">${p.matches.map(m => `
      <li><span class="tag">${esc(m.kind)}</span>
        <span class="date">${esc(m.ymd)}</span>
        ${m.link ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title)}
        ${m.media ? `<span class="why">· ${esc(m.media)}</span>` : ''}
        <span class="why">· 겹친 말: ${esc(m.shared.slice(0, 6).join(', '))}</span>
      </li>`).join('')}</ul>`
    : `<h4>우리 쪽 관련 자료</h4><div style="color:var(--muted);font-size:12px">겹치는 자료를 찾지 못했습니다.</div>`;
  const files = p.첨부 && p.첨부.length
    ? `<h4>첨부 ${p.첨부.length}개</h4>` + p.첨부.map((u, i) =>
        `<a href="${esc(u)}" target="_blank" rel="noopener" style="margin-right:10px">첨부 ${i + 1}</a>`).join('')
    : '';
  return `<div class="body">
    <h4>본문 ${p.상태 ? `(${esc(p.상태)})` : ''}</h4>
    <div class="txt">${esc(p.본문) || '본문이 저장되지 않았습니다.'}</div>
    ${p.비고 ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">수집 비고: ${esc(p.비고)}</div>` : ''}
    ${files}
    ${ours}
    <h4>원문</h4><a href="${esc(p.원문)}" target="_blank" rel="noopener">${esc(p.원문)}</a>
  </div>`;
}

// ── 엑셀 ─────────────────────────────────────────────────────────────────────
// 화면이 보여 주는 그대로 한 장. 본문은 길어서 앞 1,000자만 담는다
const XL_FONT = '나눔고딕', XL_LEFT = new Set(['제목', '주제', '본문(앞부분)', '원문', '우리 쪽 관련 자료']);
function downloadExcel() {
  if (!rows.length) { alert('내려받을 보도자료가 없습니다.'); return; }
  const head = ['게시일', '기관', '제목', '부서', '관련도', '주제', '우리 자료', '우리 쪽 관련 자료', '본문(앞부분)', '원문'];
  const body = rows.map(p => [
    p.날짜, p.기관, p.제목, p.부서, p.rel,
    p.tags.map(t => t.key).join(', '),
    p.matches.length,
    p.matches.map(m => `[${m.kind}] ${m.ymd} ${m.title}`).join('\n'),
    (p.본문 || '').slice(0, 1000),
    p.원문,
  ]);
  const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
  ws['!cols'] = head.map(h => ({wch: h === '제목' ? 52 : h === '본문(앞부분)' ? 60 :
    h === '우리 쪽 관련 자료' ? 46 : h === '원문' ? 40 : 11}));
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let r = range.s.r; r <= range.e.r; r++)
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({r, c})];
      if (!cell) continue;
      const isHead = r === 0;
      cell.s = {
        font: {name: XL_FONT, sz: 9, bold: isHead},
        alignment: {horizontal: !isHead && XL_LEFT.has(head[c]) ? 'left' : 'center',
                    vertical: 'center', wrapText: false},
        ...(isHead ? {fill: {fgColor: {rgb: 'F2F2F0'}}} : {}),
      };
    }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '보도자료');
  XLSX.writeFile(wb, `보건의료4개기관_보도자료_${rows.length}건_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

load();
</script>

</html>
