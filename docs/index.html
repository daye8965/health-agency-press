<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보건의료 4개 기관 보도자료</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- SheetJS 무료판은 글꼴·정렬을 저장하지 못해, 같은 API에 서식만 더한 갈래를 쓴다 (연구성과 레이더와 같은 것) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
/* 생김새는 '서울아산병원 연구성과 레이더'와 같은 틀을 쓴다 — 같은 팀이 나란히 쓰는 화면이라
   짙은 남색 머리글 · Noto Sans KR + DM Mono · 청록 accent · stat-card · table-wrap 그대로다 */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
:root{
  --bg:#f7f7f5;--surface:#fff;--border:#e4e4e0;
  --text:#1a1a18;--muted:#6b6b67;--accent:#0e6e7a;--accent-bg:#eaf5f6;--blue:#1a5fa8;
  --hi:#c0392b;--mid:#b45309;--lo:#9a9a94;
  --radius:8px;--font:'Noto Sans KR',sans-serif;--mono:'DM Mono',monospace;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh}

header{background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#fff;padding:22px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20}
header h1{font-size:22px;font-weight:700;letter-spacing:-.4px;color:#fff}
header p{font-size:12px;color:#cbd5e1;margin-top:3px}
header #last-updated{font-family:var(--mono);font-size:11px;color:#94a3b8;margin-top:2px}
#total-badge{font-family:var(--mono);font-size:12px;font-weight:600;background:rgba(255,255,255,.06);
  color:#e2e8f0;border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:20px;white-space:nowrap}

.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 32px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{font-family:var(--font);font-size:13px;padding:5px 10px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);color:var(--text);outline:none}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--accent)}
#search-input{width:240px;max-width:100%}
.filter-bar button{font-family:var(--font);font-size:13px;padding:5px 12px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--bg);color:var(--muted);cursor:pointer}
.filter-bar button:hover{border-color:var(--accent);color:var(--accent)}
.excel-btn{display:inline-flex;align-items:center;gap:5px;background:var(--accent)!important;
  color:#fff!important;border-color:var(--accent)!important}
#result-count{font-size:12px;color:var(--muted);margin-left:auto;font-family:var(--mono)}
.check-label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;
  cursor:pointer;white-space:nowrap}

main{padding:20px 32px;max-width:1320px;margin:0 auto}
.notice{background:#fffbea;border:1px solid #f0e2a8;border-radius:var(--radius);padding:10px 14px;
  font-size:12px;color:#5a4a00;margin-bottom:14px;line-height:1.7}
.notice b{font-weight:600}
.notice.warn{background:#fdf0ed;border-color:#f3c6bc;color:#8e2f1e}
.notice details{margin-top:4px}
.notice summary{cursor:pointer;font-weight:600}
.card-help{margin:4px 0 2px 18px;padding:0}
.card-help li{margin:1px 0}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;cursor:pointer;text-align:left;font-family:var(--font);transition:border-color .12s,background .12s}
.stat-card:hover{border-color:var(--accent)}
.stat-card.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:inset 0 -3px 0 var(--accent)}
.stat-card .label{font-size:10px;color:var(--muted);letter-spacing:.5px;margin-bottom:3px}
.stat-card .value{font-size:20px;font-weight:600;font-family:var(--mono)}

.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:960px}
thead th{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px;padding:9px 10px;
  text-align:left;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap}
thead th.sortable{cursor:pointer;user-select:none}
thead th.sortable:hover,thead th.sortable.on{color:var(--accent)}
thead th .arrow{margin-left:3px;font-size:9px;opacity:.45}
thead th.on .arrow{opacity:1}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:none}
tbody tr.head-row{cursor:pointer}
tbody tr.head-row:hover{background:var(--accent-bg)}
tbody tr.open-row{background:var(--accent-bg)}
td{padding:10px 10px;vertical-align:top}
.td-date{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.td-title{font-weight:500;font-size:13px;line-height:1.5}
.sub{font-size:11px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.agency{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:4px;white-space:nowrap}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;background:#f0f0ec;color:#666}
.tag.core{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tag.far{background:#f4f4f2;color:#9a9a94}
.rel{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap}
.rel.높음{background:var(--hi);color:#fff}
.rel.보통{background:#fdf0e3;color:var(--mid)}
.rel.낮음{background:#f0f0ec;color:var(--lo)}
.ours-n{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--blue);white-space:nowrap}
.ours-n.none{color:var(--muted);font-weight:400}
.src a{font-size:11px;color:var(--muted);text-decoration:none;white-space:nowrap}
.src a:hover{color:var(--accent)}
.toggle{font-size:10px;color:var(--muted);font-family:var(--mono)}

/* 펼친 줄 */
.detail td{background:#fcfcfb;padding:4px 18px 18px 18px}
.detail h4{font-size:10px;color:var(--muted);letter-spacing:.5px;font-weight:600;margin:14px 0 6px}
.detail h4:first-child{margin-top:8px}
.body-txt{white-space:pre-wrap;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;max-height:340px;overflow:auto;font-size:12.5px;line-height:1.75;color:#333}
.ours-list{list-style:none}
.ours-list li{margin:4px 0;font-size:12px;line-height:1.5}
.ours-list a{color:var(--text);text-decoration:none;font-weight:500}
.ours-list a:hover{color:var(--accent)}
.ours-list .why{font-family:var(--mono);font-size:10px;color:var(--muted)}
.kind{display:inline-block;font-size:10px;font-weight:600;padding:0 5px;border-radius:3px;
  background:#e8f0fa;color:var(--blue);margin-right:4px}
.kind.기사{background:#f0f0ec;color:#666}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:13px}
@media(max-width:860px){header,.filter-bar,main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>

<header>
  <div>
    <h1>📋 보건의료 4개 기관 보도자료</h1>
    <p>서울아산병원 홍보팀 · 보건복지부 · 식약처 · 건보공단 · 심평원 · 매일 자동 수집 · 제작: 이다예</p>
    <p id="last-updated">불러오는 중…</p>
  </div>
  <span id="total-badge">—</span>
</header>

<div class="filter-bar">
  <input type="date" id="date-from" title="게시일부터" onchange="onFilter()">
  <span style="color:var(--muted);font-size:12px">~</span>
  <input type="date" id="date-to" title="게시일까지" onchange="onFilter()">
  <select id="rel" onchange="onFilter()">
    <option value="">관련도 전체</option>
    <option value="높음">높음만</option>
    <option value="높음+보통">높음+보통</option>
    <option value="낮음">낮음만</option>
  </select>
  <select id="topic" onchange="onFilter()"><option value="">전체 주제</option></select>
  <input type="text" id="search-input" placeholder="제목·본문 검색 (-제외어)" oninput="onFilter()">
  <label class="check-label" title="우리 보도자료·기사와 낱말이 겹치는 것만">
    <input type="checkbox" id="onlyOurs" onchange="onFilter()"> 우리 자료와 엮인 것만</label>
  <button onclick="resetFilters()">초기화</button>
  <span id="result-count"></span>
  <button class="excel-btn" onclick="downloadExcel()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    엑셀 다운로드
  </button>
</div>

<main>
  <div id="fail" class="notice warn" hidden></div>
  <div id="warn" class="notice warn" hidden></div>
  <div class="notice" id="howto">불러오는 중…</div>

  <div class="stats-row" id="cards"></div>

  <div class="table-wrap">
    <table>
      <thead><tr>
        <th class="sortable" onclick="doSort('날짜')" style="width:84px">게시일 <span class="arrow" id="ar-날짜">↕</span></th>
        <th class="sortable" onclick="doSort('기관')" style="width:92px">기관 <span class="arrow" id="ar-기관">↕</span></th>
        <th>보도내용</th>
        <th class="sortable" onclick="doSort('관련도')" style="width:72px">관련도 <span class="arrow" id="ar-관련도">↕</span></th>
        <th class="sortable" onclick="doSort('우리자료')" style="width:78px">우리 자료 <span class="arrow" id="ar-우리자료">↕</span></th>
        <th style="width:54px">원문</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="6"><div class="empty">불러오는 중…</div></td></tr></tbody>
    </table>
  </div>
</main>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// 이 화면은 docs/press.json(정부 보도자료)과 docs/ours.json(우리 보도자료·기사)만 읽는다.
// 구글 시트를 브라우저가 직접 읽을 수는 없어(CORS) GitHub Actions가 매일 옮겨 둔다.
// 판정 규칙은 전부 아래 상수다 — 고치면 바로 화면에 반영된다(수집을 다시 돌릴 필요 없음).
// ─────────────────────────────────────────────────────────────────────────────

const AGENCY = {
  '보건복지부':      {short:'복지부', color:'#1a5fa8'},
  '식품의약품안전처': {short:'식약처', color:'#1a7a3c'},
  '국민건강보험공단': {short:'건보공단', color:'#7b3fa0'},
  '건강보험심사평가원':{short:'심평원', color:'#c0392b'},
};

// 주제 태그 — **제목과 본문 앞머리**(TAG_HEAD자)에서 찾는다.
//   core : 병원 운영·진료·연구에 직접 닿는 것 → 하나라도 있으면 관련도 '높음'
//   mid  : 닿긴 하지만 사안에 따라 갈리는 것   → 관련도 '보통'
//   far  : 우리 일과 먼 것                     → core가 없으면 관련도 '낮음'
//
// **본문 전체를 보면 안 된다.** 보도자료 뒤쪽에는 근거 법령·참고자료·다른 사업 설명이
// 붙어 지나가는 말이 다 걸린다 — `폐의약품 수거` 기사에 `노인 일자리`(복지일반)가,
// `수능 마약류 점검`에 `고혈압`(질환·검진)이 그렇게 붙었다. 정부 보도자료는 앞머리에
// 무엇에 대한 글인지가 다 나오므로 거기까지만 본다.
const TAG_HEAD = 400;
//
// **낱말은 실제 보도자료에 나오는 말로 고르고, 다른 말 안에 박히지 않는지 꼭 확인한다.**
// 처음에 넣었다가 뺀 것들 — 전부 기관 이름 안에 글자가 들어 있었다:
//   · `심사평가` ← `건강보험심사평가원`. 심평원 보도자료 **전부**가 '수가·급여'로 찍혔다.
//   · `식품`     ← `식품의약품안전처`.   식약처 보도자료 **전부**가 '식품·위생'으로 찍혔다.
//   · `전문의`   ← `전문의약품`.         마약류 점검 기사가 '의료인력·수련'이 됐다.
//   · `AI`       ← 영문 낱말 속 AI.      `\bAI\b`로 묶었다.
const TOPICS = [
  {key:'수가·급여',      kind:'core', re:/수가|급여화|요양급여|상대가치|진료비|보상 ?체계|본인부담|보장성|건강보험 적용|급여 기준|비급여/},
  {key:'의료AI·데이터',  kind:'core', re:/인공지능|\bAI\b|빅데이터|의료데이터|데이터 ?표준|상호운용|디지털 ?의료|의료정보|마이데이터|전자의무기록|EMR|정밀의료/},
  {key:'의료인력·수련',  kind:'core', re:/전공의|전문의(?!약품)|수련|의료인력|간호 ?인력|간호사|의과대학|의대 ?정원|인력 ?기준|당직/},
  {key:'환자안전·감염',  kind:'core', re:/환자안전|의료사고|감염 ?관리|의료관련감염|감염병|낙상|투약 ?오류|손 ?위생/},
  {key:'응급·중증',      kind:'core', re:/응급의료|응급실|중증|권역 ?외상|심뇌혈관|이송 ?체계|필수의료/},
  {key:'질환·검진',      kind:'core', re:/암 ?관리|암 ?검진|국가 ?검진|건강검진|희귀질환|만성질환|치매|당뇨|고혈압|재활/},
  {key:'돌봄·지역의료',  kind:'core', re:/통합 ?돌봄|재택의료|방문 ?진료|호스피스|완화의료|지역 ?의료|공공 ?의료|요양병원|간병/},
  {key:'연구·R&D',       kind:'core', re:/연구개발|R&D|연구 ?과제|성과교류|기술개발|실증|연구중심병원|임상연구/},
  {key:'의약품·의료기기',kind:'mid',  re:/의약품(?!안전처)|의약외품|의료기기|신약|품목 ?허가|임상시험|마약류|혁신의료기기|첨단재생|백신|회수 ?조치/},
  {key:'행사·협약',      kind:'mid',  re:/포럼|세미나|설명회|학술대회|공모|시상|수상|캠페인|업무협약|간담회|토론회|공청회/},
  {key:'식품·위생',      kind:'far',  re:/식품(?!의약품)|식중독|농축수산|GMO|유전자변형|급식|건강기능식품|주류|축산물|이물/},
  {key:'복지일반',       kind:'far',  re:/위기가구|기초생활|사회보장|아동학대|노인 ?일자리|장애인 ?복지|복지 ?사각|보육|연금/},
  {key:'기관 내부',      kind:'far',  re:/임직원|노사|채용 ?공고|봉사활동|체험 ?교육|청렴|윤리경영|조직 ?개편|인사 ?발령/},
];

// ── 우리 자료와 엮기 ─────────────────────────────────────────────────────────
// 정부 보도자료의 낱말과 우리 보도자료·기사 제목의 낱말이 겹치는 정도로 본다.
// 글자쌍(bigram)이 아니라 **낱말**로 보는 이유는, 글자쌍으로 재면 `의료`·`사업` 같은
// 흔한 조각이 사방에서 맞아 아무 기사나 끌려오기 때문이다.
const JOSA = /(은|는|이|가|을|를|의|에|와|과|로|으로|도|만|에서|에게|부터|까지|라고|이라고|에는|으로는)$/;
// 보건의료 글이면 어디에나 나오는 말 — 이것만 겹치는 건 '관련'이 아니다
const STOP = new Set(`
보건복지부 식품의약품안전처 국민건강보험공단 건강보험심사평가원 식약처 심평원 공단 복지부
병원 의료 의료계 의료기관 환자 국민 정부 기관 사업 제도 정책 방안 계획 추진 지원 강화 확대
마련 개최 실시 운영 발표 공개 제공 시행 도입 구축 개선 관리 평가 활용 참여 협력 연계 대상
결과 내용 주요 관련 통해 위해 대한 이번 올해 지난 다음 전국 국내 지역 현장 중심 기반 체계
서비스 프로그램 시스템 데이터 정보 기술 분야 산업 기업 전문가 담당자 관계자 교수 연구 연구팀
서울아산병원 아산병원 서울 아산 밝혔다 했다 한다 된다 있다 등의 등을 및 또한 특히 이를 이에
적용 다른 모색 논의 확인 공유 안내 개선 자동 전국적 가능 필요 사용 이용 선정 발굴 조성 개발
`.trim().split(/\s+/));
// `11월`·`2026년`·`3개` 같은 **숫자+단위**는 아무 글에나 있다. 이것만 겹쳐 점수 5점을 넘겨
// `통합사례관리 전국대회`가 `동대문구 … 4개 …` 기사와 엮인 적이 있다
const NUM_UNIT = /^\d+(년|월|일|시|분|회|차|개|명|건|곳|억|만|천|％|%|kg|mm|cm|km)?$/;

const MATCH_FLOOR = 5;   // 아래 가중치 합이 이 값 이상이면 '엮인 것'으로 본다
const MATCH_MAX = 6;     // 한 건에 보여 줄 우리 자료 개수
// 긴 낱말일수록 우연히 겹칠 일이 적다 — 4글자 이상 하나(3점) + 3글자 하나(2점)면 문턱을 넘는다
function wordWeight(w) { return w.length >= 4 ? 3 : w.length === 3 ? 2 : 1; }

function words(text) {
  const out = new Set();
  for (let raw of String(text || '').split(/[^가-힣A-Za-z0-9]+/)) {
    if (!raw) continue;
    let w = raw.replace(JOSA, '');
    if (w.length < 2 || STOP.has(w)) continue;
    if (NUM_UNIT.test(w)) continue;         // 날짜·개수는 아무 글에나 있다
    out.add(w);
  }
  return out;
}

let press = [], ours = {보도자료: [], 기사: []}, ourIndex = [], rows = [];

function buildOurIndex() {
  ourIndex = [];
  (ours['보도자료'] || []).forEach(([ymd, title]) =>
    ourIndex.push({kind: '보도자료', ymd, title, link: '', w: words(title)}));
  (ours['기사'] || []).forEach(([ymd, media, title, link]) =>
    ourIndex.push({kind: '기사', ymd, title, media, link, w: words(title)}));
}

// 보도자료 한 건과 엮이는 우리 자료를 점수 순으로. 본문은 앞부분만 본다 —
// 뒤쪽은 참고자료·문의처라 겹쳐도 뜻이 없다
const BODY_HEAD = 500;
function ourMatches(p) {
  const gw = words(p['제목'] + ' ' + (p['본문'] || '').slice(0, BODY_HEAD));
  const hits = [];
  for (const o of ourIndex) {
    let score = 0;
    const shared = [];
    for (const w of o.w) if (gw.has(w)) { score += wordWeight(w); shared.push(w); }
    if (score >= MATCH_FLOOR) hits.push({...o, score, shared});
  }
  hits.sort((a, b) => b.score - a.score || b.ymd.localeCompare(a.ymd));
  // 보도자료를 기사보다 먼저 — 우리가 낸 것이 있으면 그게 가장 쓸모 있다
  hits.sort((a, b) => (a.kind === '보도자료' ? 0 : 1) - (b.kind === '보도자료' ? 0 : 1));
  return hits.slice(0, MATCH_MAX);
}

function topicsOf(p) {
  const text = p['제목'] + ' ' + (p['본문'] || '').slice(0, TAG_HEAD);
  return TOPICS.filter(t => t.re.test(text));
}
// 높음 = 우리 일에 바로 닿는 주제가 있다 · 낮음 = 먼 주제뿐이다 · 보통 = 그 사이
// **가까운 주제와 먼 주제가 같이 있으면 '보통'으로 내린다.** `복지서비스, AI로 더 똑똑해진
// 모바일 행복이`가 `AI` 하나로 '높음'이 됐는데, 복지 안내 앱이라 우리 일과는 멀다.
// 둘이 섞였다는 건 경계에 있다는 뜻이라 사람이 보고 판단할 자리다.
function relevanceOf(tags) {
  const core = tags.some(t => t.kind === 'core'), far = tags.some(t => t.kind === 'far');
  if (core) return far ? '보통' : '높음';
  return far ? '낮음' : '보통';
}

// ── 불러오기 ─────────────────────────────────────────────────────────────────
async function load() {
  const bust = '?t=' + Date.now();
  let data = null;
  try {
    data = await (await fetch('./press.json' + bust)).json();
  } catch (e) {
    const f = document.getElementById('fail');
    f.hidden = false;
    f.textContent = '보도자료 데이터를 불러오지 못했습니다 (docs/press.json). 수집 워크플로가 한 번은 돌아야 합니다.';
    document.getElementById('tbody').innerHTML = '<tr><td colspan="6"><div class="empty">데이터 없음</div></td></tr>';
    return;
  }
  try { ours = await (await fetch('./ours.json' + bust)).json(); } catch (e) { /* 없으면 엮기만 빠진다 */ }
  buildOurIndex();

  press = (data['보도자료'] || []).map(p => {
    const tags = topicsOf(p);
    return {...p, tags, rel: relevanceOf(tags), matches: ourMatches(p)};
  });

  document.getElementById('total-badge').textContent = `총 ${data['건수']}건`;
  document.getElementById('last-updated').textContent =
    `마지막 수집 : ${(data['기준시각'] || '').slice(0, 16)}`;

  // 수집로그에 실패가 있으면 숫자를 믿지 말라고 띄운다 — '오류를 신규 0건으로 읽지 않기'
  const last = (data['수집로그'] || [])[0];
  const bad = (data['수집로그'] || []).filter(l => l.결과 && l.결과 !== '성공');
  if (bad.length) {
    const w = document.getElementById('warn');
    w.hidden = false;
    w.innerHTML = `<b>수집 경고</b> — ${bad.map(b => `${esc(b.기관)}: ${esc(b.결과)}${b.비고 ? ' (' + esc(b.비고) + ')' : ''}`).join(' · ')}`;
  }

  // 맨 위 안내 — 이 화면을 처음 여는 사람이 가장 먼저 알아야 할 것들
  document.getElementById('howto').innerHTML =
    `보건복지부·식품의약품안전처·국민건강보험공단·건강보험심사평가원의 <b>공식 보도자료</b>를 모읍니다. ` +
    `줄을 누르면 본문과 <b>우리 쪽 관련 자료</b>가 펼쳐집니다. ` +
    `<a href="${esc(data['시트'])}" target="_blank" rel="noopener">원본 구글 시트</a> · ` +
    `우리 자료 ${ourIndex.length}건(보도자료 ${(ours['보도자료'] || []).length} · 기사 ${(ours['기사'] || []).length}, ${esc(ours['기준일'] || '-')} 이후)와 맞춰 봅니다.` +
    `<ul class="card-help">
       <li><b>관련도</b> — 주제 태그로 정한 <b>추정</b>입니다. 가까운 주제(<span class="tag core">청록</span>)가 있으면 높음,
           먼 주제만 있으면 낮음, 둘이 섞이면 보통입니다. <b>판단은 사람이 합니다.</b></li>
       <li><b>우리 자료</b> — 우리 보도자료·아산 기사 중 낱말이 겹치는 것. 펼치면 <b>어떤 말이 겹쳤는지</b> 같이 보입니다.</li>
       <li><b>위 카드 여섯 개가 곧 필터입니다</b> — 누르면 그것만, 다시 누르면 풀립니다. 여러 개를 함께 걸 수 있습니다.</li>
     </ul>` +
    `<b>수집(Aside)과 화면 갱신(GitHub Actions)은 따로 돕니다</b> — 화면이 안 바뀌면 수집이 아직 안 돈 것이지 ` +
    `보도자료가 없는 것이 아닙니다` + (last ? ` (시트 마지막 실행 ${esc(last.실행시각)}).` : '.');

  fillTopicSelect();
  onFilter();              // 안에서 buildCards()까지 한다
}

function fillTopicSelect() {
  const sel = document.getElementById('topic');
  const n = {};
  press.forEach(p => p.tags.forEach(t => n[t.key] = (n[t.key] || 0) + 1));
  TOPICS.filter(t => n[t.key]).forEach(t => {
    const o = document.createElement('option');
    o.value = t.key; o.textContent = `${t.key} (${n[t.key]})`;
    sel.appendChild(o);
  });
}

// 카드는 여섯 개 다 누르면 그것만 보이는 필터다(기관 4 + 관련도 높음 + 우리 자료와 엮임).
// **관련도·엮임 카드는 따로 상태를 두지 않고 위 필터바의 select·체크박스를 그대로 움직인다** —
// 상태를 두 벌로 두면 카드는 켜졌는데 필터바는 꺼져 있는 식으로 반드시 어긋난다.
// 숫자는 늘 **필터와 무관한 전체 기준**이다. 눌러서 좁힌 뒤에도 전체에 몇 건인지 보여야 한다.
let agencyPick = '';
function buildCards() {
  const n = {};
  press.forEach(p => n[p.기관] = (n[p.기관] || 0) + 1);
  const hi = press.filter(p => p.rel === '높음').length;
  const linked = press.filter(p => p.matches.length).length;
  const relOn = document.getElementById('rel').value === '높음';
  const oursOn = document.getElementById('onlyOurs').checked;
  document.getElementById('cards').innerHTML =
    Object.keys(AGENCY).map(a => `
      <div class="stat-card ${agencyPick === a ? 'on' : ''}" onclick="pickAgency('${a}')"
           title="${agencyPick === a ? '전체 기관 다시 보기' : a + '만 보기'}">
        <div class="label" style="color:${AGENCY[a].color};font-weight:700">${AGENCY[a].short}</div>
        <div class="value">${n[a] || 0}</div>
      </div>`).join('') +
    `<div class="stat-card ${relOn ? 'on' : ''}" onclick="pickHigh()"
          title="${relOn ? '관련도 전체 다시 보기' : '관련도 높음만 보기'}">
       <div class="label">관련도 높음</div><div class="value" style="color:var(--hi)">${hi}</div></div>
     <div class="stat-card ${oursOn ? 'on' : ''}" onclick="pickLinked()"
          title="${oursOn ? '전체 다시 보기' : '우리 자료와 엮인 것만 보기'}">
       <div class="label">우리 자료와 엮임</div><div class="value" style="color:var(--blue)">${linked}</div></div>`;
}
function pickAgency(a) { agencyPick = (agencyPick === a) ? '' : a; onFilter(); }
function pickHigh() {
  const s = document.getElementById('rel');
  s.value = s.value === '높음' ? '' : '높음';
  onFilter();
}
function pickLinked() {
  const c = document.getElementById('onlyOurs');
  c.checked = !c.checked;
  onFilter();
}

function resetFilters() {
  ['date-from', 'date-to', 'search-input'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('rel').value = '';
  document.getElementById('topic').value = '';
  document.getElementById('onlyOurs').checked = false;
  agencyPick = '';
  onFilter();
}

// 검색: 공백으로 나눈 모든 낱말을 AND, `-낱말`은 제외. 대상은 제목+본문+부서
function searchHit(p, q) {
  if (!q) return true;
  const hay = (p.제목 + ' ' + p.본문 + ' ' + p.부서).toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(term =>
    term.startsWith('-') ? !hay.includes(term.slice(1)) : hay.includes(term));
}

// ── 정렬 ─────────────────────────────────────────────────────────────────────
const REL_ORDER = {'높음': 0, '보통': 1, '낮음': 2};
let sort = {col: '날짜', asc: false};
function doSort(col) {
  if (sort.col === col) sort.asc = !sort.asc;
  else sort = {col, asc: col === '기관'};   // 날짜·관련도·우리자료는 큰 것부터가 쓸모 있다
  onFilter();
}
function sortValue(p, col) {
  if (col === '기관') return p.기관;
  if (col === '관련도') return String(REL_ORDER[p.rel]);
  if (col === '우리자료') return String(p.matches.length).padStart(3, '0');
  return p.날짜 + p.id;
}

function onFilter() {
  const from = document.getElementById('date-from').value;
  const to = document.getElementById('date-to').value;
  const rel = document.getElementById('rel').value;
  const topic = document.getElementById('topic').value;
  const q = document.getElementById('search-input').value.trim();
  const onlyOurs = document.getElementById('onlyOurs').checked;

  rows = press.filter(p =>
    (!agencyPick || p.기관 === agencyPick) &&
    (!from || p.날짜 >= from) && (!to || p.날짜 <= to) &&
    (!rel || (rel === '높음+보통' ? p.rel !== '낮음' : p.rel === rel)) &&
    (!topic || p.tags.some(t => t.key === topic)) &&
    (!onlyOurs || p.matches.length) &&
    searchHit(p, q));

  const dir = sort.asc ? 1 : -1;
  rows.sort((a, b) => sortValue(a, sort.col).localeCompare(sortValue(b, sort.col), 'ko') * dir
                      || b.날짜.localeCompare(a.날짜));

  document.getElementById('result-count').textContent = `${rows.length}건`;
  ['날짜', '기관', '관련도', '우리자료'].forEach(c => {
    const th = document.getElementById('ar-' + c).parentElement;
    th.classList.toggle('on', sort.col === c);
    document.getElementById('ar-' + c).textContent = sort.col === c ? (sort.asc ? '↑' : '↓') : '↕';
  });
  // 카드 하이라이트는 여기서 다시 칠한다 — 필터바의 select·체크박스를 직접 건드렸을 때도
  // 카드가 따라 켜지고 꺼져야 한다 (카드만 고치면 두 곳이 어긋난다)
  buildCards();
  render();
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const open = new Set();
function toggle(id) { open.has(id) ? open.delete(id) : open.add(id); render(); }

function render() {
  const box = document.getElementById('tbody');
  if (!rows.length) {
    box.innerHTML = '<tr><td colspan="6"><div class="empty">조건에 맞는 보도자료가 없습니다.</div></td></tr>';
    return;
  }
  box.innerHTML = rows.map(p => {
    const a = AGENCY[p.기관] || {short: p.기관, color: '#666'};
    const isOpen = open.has(p.id);
    return `<tr class="head-row ${isOpen ? 'open-row' : ''}" onclick="toggle('${esc(p.id)}')">
      <td class="td-date">${esc(p.날짜)}</td>
      <td><span class="agency" style="background:${a.color}1a;color:${a.color}">${esc(a.short)}</span></td>
      <td>
        <div class="td-title">${esc(p.제목)}</div>
        <div class="sub">
          ${p.부서 ? `<span>${esc(p.부서)}</span>` : ''}
          ${p.tags.map(t => `<span class="tag ${t.kind}">${esc(t.key)}</span>`).join('')}
          ${p.상태 && p.상태 !== '전체' ? `<span class="tag far">본문 ${esc(p.상태)}</span>` : ''}
          <span class="toggle">${isOpen ? '▲ 접기' : '▼ 펼치기'}</span>
        </div>
      </td>
      <td><span class="rel ${p.rel}">${p.rel}</span></td>
      <td><span class="ours-n ${p.matches.length ? '' : 'none'}">${p.matches.length ? p.matches.length + '건' : '—'}</span></td>
      <td class="src"><a href="${esc(p.원문)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">열기 ↗</a></td>
    </tr>` + (isOpen ? `<tr class="detail"><td colspan="6">${bodyHtml(p)}</td></tr>` : '');
  }).join('');
}

function bodyHtml(p) {
  const list = p.matches.length ? `
    <ul class="ours-list">${p.matches.map(m => `
      <li><span class="kind ${m.kind}">${esc(m.kind)}</span>
        <span class="td-date">${esc(m.ymd)}</span>
        ${m.link ? `<a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.title)}</a>` : esc(m.title)}
        ${m.media ? `<span class="why">· ${esc(m.media)}</span>` : ''}
        <span class="why">· 겹친 말: ${esc(m.shared.slice(0, 6).join(', '))}</span>
      </li>`).join('')}</ul>`
    : `<div style="color:var(--muted);font-size:12px">겹치는 자료를 찾지 못했습니다.</div>`;
  const files = p.첨부 && p.첨부.length
    ? `<h4>첨부 ${p.첨부.length}개</h4>` + p.첨부.map((u, i) =>
        `<a href="${esc(u)}" target="_blank" rel="noopener" style="font-size:12px;margin-right:12px;color:var(--accent)">첨부 ${i + 1} ↗</a>`).join('')
    : '';
  return `
    <h4>본문 ${p.상태 ? `(${esc(p.상태)})` : ''}</h4>
    <div class="body-txt">${esc(p.본문) || '본문이 저장되지 않았습니다.'}</div>
    ${p.비고 ? `<div style="font-size:11px;color:var(--muted);margin-top:6px">수집 비고: ${esc(p.비고)}</div>` : ''}
    ${files}
    <h4>우리 쪽 관련 자료 ${p.matches.length ? p.matches.length + '건' : ''}</h4>
    ${list}`;
}

// ── 엑셀 ─────────────────────────────────────────────────────────────────────
// 화면이 보여 주는 그대로 한 장. 본문은 길어서 앞 1,000자만 담는다
const XL_FONT = '나눔고딕', XL_LEFT = new Set(['제목', '주제', '본문(앞부분)', '원문', '우리 쪽 관련 자료']);
function downloadExcel() {
  if (!rows.length) { alert('내려받을 보도자료가 없습니다.'); return; }
  const head = ['게시일', '기관', '제목', '부서', '관련도', '주제', '우리 자료', '우리 쪽 관련 자료', '본문(앞부분)', '원문'];
  const body = rows.map(p => [
    p.날짜, p.기관, p.제목, p.부서, p.rel,
    p.tags.map(t => t.key).join(', '),
    p.matches.length,
    p.matches.map(m => `[${m.kind}] ${m.ymd} ${m.title}`).join('\n'),
    (p.본문 || '').slice(0, 1000),
    p.원문,
  ]);
  const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
  ws['!cols'] = head.map(h => ({wch: h === '제목' ? 52 : h === '본문(앞부분)' ? 60 :
    h === '우리 쪽 관련 자료' ? 46 : h === '원문' ? 40 : 11}));
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let r = range.s.r; r <= range.e.r; r++)
    for (let c = range.s.c; c <= range.e.c; c++) {
      const cell = ws[XLSX.utils.encode_cell({r, c})];
      if (!cell) continue;
      const isHead = r === 0;
      cell.s = {
        font: {name: XL_FONT, sz: 9, bold: isHead},
        alignment: {horizontal: !isHead && XL_LEFT.has(head[c]) ? 'left' : 'center',
                    vertical: 'center', wrapText: false},
        ...(isHead ? {fill: {fgColor: {rgb: 'F2F2F0'}}} : {}),
      };
    }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '보도자료');
  XLSX.writeFile(wb, `보건의료4개기관_보도자료_${rows.length}건_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

load();
</script>
</body>
